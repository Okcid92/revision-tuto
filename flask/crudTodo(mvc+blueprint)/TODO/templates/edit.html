{%extends 'base.html'%}

{%block title%} EDIT {%endblock%}

{%block body%}

    <form action="{{ url_for ('action.edit')}} " method="post">
        <select class="form-select" aria-label="Default select example" name="id">
            {%for todo in todoid %}
            <option value="{{ todo.id }}"> {{ todo.id }} </option>
            {%endfor%}
        </select>
        <div class="row mb-3">
            <label for="inputEmail3" class="col-sm-2 col-form-label">title</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="inputEmail3" name="title">
            </div>
        </div>
        <div class="row mb-3">
            <label for="inputEmail3" class="col-sm-2 col-form-label">content</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="inputEmail3" name="content">
            </div>
        </div>
        <fieldset class="row mb-3">
            <legend class="col-form-label col-sm-2 pt-0">status</legend>
            <div class="col-sm-10">
            <div class="form-check">
                <input class="form-check-input" type="radio" name="status" id="gridRadios1" value="True">
                <label class="form-check-label" for="gridRadios1">
                done
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="status" id="gridRadios2" value="False">
                <label class="form-check-label" for="gridRadios2">
                    not done
                </label>
            </div>

        </fieldset>
        <button type="submit" class="btn btn-primary">EDIT</button>
    </form>

{%endblock%}
